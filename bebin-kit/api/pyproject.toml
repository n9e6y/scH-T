[project]
name = "bebin-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "openai>=1.40",
  "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "pandas>=2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
